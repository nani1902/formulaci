<!doctype html><html lang="en"><head><meta charset="utf-8"><title>CKD-EPI 2021 eGFR Calculator</title>
<link rel="stylesheet" href="_style.css"></head><body>
<h1>eGFR Calculator (CKD-EPI 2021)</h1>
<p>Uses the 2021 CKD-EPI creatinine equation, refit without race.</p>
<form class="calc" id="egfr-form" onsubmit="return false">
 <div class="row"><label for="scr">Serum creatinine</label><input id="scr" name="scr" type="number" step="any">
  <select id="scr-unit" name="scr_unit"><option value="mg/dL">mg/dL</option><option value="umol/L">µmol/L</option></select></div>
 <div class="row"><label for="age">Age (years)</label><input id="age" name="age" type="number"></div>
 <div class="row"><label>Sex</label>
  <label><input type="radio" name="sex" value="female"> Female</label>
  <label><input type="radio" name="sex" value="male"> Male</label></div>
 <button id="calculate" type="button">Calculate</button>
 <div class="result" id="egfr-result" aria-live="polite"></div>
</form>
<script>
document.getElementById('calculate').addEventListener('click', function () {
  var scr = parseFloat(document.getElementById('scr').value);
  if (document.getElementById('scr-unit').value === 'umol/L') scr = scr / 88.4;
  var age = parseFloat(document.getElementById('age').value);
  var s = document.querySelector('input[name=sex]:checked');
  if (!s || !(scr > 0) || !(age > 0)) { document.getElementById('egfr-result').textContent = 'Please complete all fields'; return; }
  var f = s.value === 'female', k = f ? 0.7 : 0.9, a = f ? -0.241 : -0.302, r = scr / k;
  var g = 142 * Math.pow(Math.min(r, 1), a) * Math.pow(Math.max(r, 1), -1.2) * Math.pow(0.9938, age) * (f ? 1.012 : 1);
  setTimeout(function () { document.getElementById('egfr-result').textContent = 'eGFR = ' + Math.round(g) + ' mL/min/1.73m²'; }, 120);
});
</script></body></html>

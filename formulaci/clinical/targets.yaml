  notes: "SSR default units SI (calcium Norm 2.25-2.625, albumin Norm 35-55 => g/L). Has an editable normal_albumin input (default probably 4 g/dL / 40 g/L). If client switches to US units use {ca} and {albumin} and normal 4."


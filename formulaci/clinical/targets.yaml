    - {fill: "input[name=height]", value: "{height}"}
  result: {selector: "#result-container", regex: '([0-9]+(?:\.[0-9]+)?)', unit: "mL/min"}
  notes: "Inputs: age, weight (kg), creatinine (SSR default µmol/L), height (cm, optional; used for IBW/AdjBW variants). Result panel likely shows several weight-based CrCl variants (actual/ideal/adjusted) -- regex picks first number; refine after first live run."

- id: mdcalc-qtc
  site: MDCalc
  title: "Corrected QT Interval (QTc)"
  url: https://www.mdcalc.com/calc/48/corrected-qt-interval-qtc
  formula: qtc_bazett@1920
  claimed_version: "unstated; formula toggle Bazett/Fridericia/Framingham/Hodges/Rautaharju"
  also_offers: [qtc_fridericia@1920, qtc_framingham@1992, qtc_hodges@1983]
  rendering: js
  selectors_verified: true
  recipe:
    - {click: "[data-name=formula] button[data-value='0']"}
    - {fill: "input[name=heart_rate]", value: "{hr}"}
    - {fill: "input[name=qt_interval]", value: "{qt}"}
  result: {selector: "#result-container", regex: '([0-9]+(?:\.[0-9]+)?)', unit: "ms"}
  notes: "data-name=formula values: 0 Bazett, 1 Fridericia, 2 Framingham, 3 Hodges, 4 Rautaharju; swap data-value to test others. Extra group data-name=speed (25/50 mm/s) suggests QT may be enterable in small boxes; HR entered in bpm (not RR)."


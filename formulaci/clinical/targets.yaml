# formulaci/clinical/targets.yaml — LIVE third-party calculator pages. Do NOT audit without the
# user's explicit go-ahead (the harness refuses non-local hosts unless --allow-live is passed).
# Schema: see formulaci/clinical/audit.py:Target. `formula` is what the page *claims*; a page whose
# code was seen to use another equation keeps its claimed key and says so in `notes`.
# Imported by the clinical session from a read-only research pass (below). Key remap applied on
# import: calcium_corrected@payne -> calcium_corrected@0.8 (every such page uses the 0.8 slope; Payne
# 1973 itself published slope 1.0, see formulas.py).
#
# targets_live.yaml -- public online medical calculator targets for formulaci audit
# Date: 2026-10-21
# Method: read-only research. Pages were fetched with GET requests only (Python urllib / curl with UA
#   "formulaci-clinical-research/0.1 (read-only audit research)", >=1.1 s between requests) plus
#   WebSearch/WebFetch. No form was submitted, no calculate button clicked, nothing POSTed, no headless browser.
#   Formula notes come from page text, server HTML, embedded __NEXT_DATA__ JSON (QxMD/Medscape) or the
#   page's own static JS bundle (NIDDK). Nothing was tested numerically.
# Entries: 84 ; selectors_verified: true = 51 (the input ids/names were seen in fetched server HTML;
#   result selectors were not always visible pre-submit -- see each entry's notes).
# Conventions: `sex` is assumed to be "female"/"male"; `when:` keys refer to canonical inputs.
#   `result.read: value` means read the element's value property (output is an <input>), otherwise textContent.
#   `iframe_src` (MSD) means steps run inside that iframe document (or load iframe_src directly).
# Caution for the harness: several "Calculate" buttons perform a real form POST/GET to the site
#   (ClinCalc ASP.NET postback, NHLBI Drupal, Inch Calculator, bmi-calculator.net, calculator.net GET);
#   flagged in notes as "server round-trip".
targets:

# ======================= MDCalc (Next.js/React; SSR markup with stable name / data-name attrs) =======================
- id: mdcalc-ckd-epi
  site: MDCalc
  title: "CKD-EPI Equations for Glomerular Filtration Rate (GFR)"
  url: https://www.mdcalc.com/calc/3939/ckd-epi-equations-glomerular-filtration-rate-gfr
  formula: egfr_ckd_epi_cr@2021
  claimed_version: "2021 race-free (page: \"This version does not include race.\")"
  also_offers: [egfr_ckd_epi_crcys@2021, egfr_ckd_epi_cr@2009]
  rendering: js
  selectors_verified: false
  recipe:
    - {click: "[data-name=calc] button[data-value='0']"}
    - {wait: 300}
    - {click: "[data-name=gender] button[data-value='0']", when: {sex: female}}
    - {click: "[data-name=gender] button[data-value='1']", when: {sex: male}}
    - {fill: "input[name=age]", value: "{age}"}
    - {fill: "input[name=creatinine]", value: "{scr_umol}"}
  result: {selector: "#result-container", regex: '([0-9]+(?:\.[0-9]+)?)', unit: "mL/min/1.73m²"}
  notes: "Equation toggle data-name=calc: 0=2021 Cr, 1=2021 Cr-CysC, 2=2009 CKD-EPI Cr, 3=2012 CysC, 4=2012 Cr-CysC. Only age input + gender group present in SSR; creatinine/cystatin inputs render after equation choice (name 'creatinine' assumed from MDRD page, cystatin name unknown). The 2009 option (data-value 2) still exists on the page -- worth auditing whether it asks race. SSR default creatinine unit is µmol/L (unit toggle button in [data-input-end-adornment]); client may switch to mg/dL by locale. No explicit calculate button: result updates live."

- id: mdcalc-mdrd
  site: MDCalc
  title: "MDRD GFR Equation"
  url: https://www.mdcalc.com/calc/76/mdrd-gfr-equation
  formula: egfr_mdrd@175
  claimed_version: "unstated constant; race input optional (\"we have decided to make race optional\")"
  rendering: js
  selectors_verified: true
  recipe:
    - {click: "[data-name=sex] button[data-value='0']", when: {sex: female}}
    - {click: "[data-name=sex] button[data-value='1']", when: {sex: male}}
    - {fill: "input[name=age]", value: "{age}"}
    - {fill: "input[name=creatinine]", value: "{scr_umol}"}
    - {click: "[data-name=black_race] button[data-value='1']", when: {black: true}}
    - {click: "[data-name=black_race] button[data-value='0']", when: {black: false}}
  result: {selector: "#result-container", regex: '([0-9]+(?:\.[0-9]+)?)', unit: "mL/min/1.73m²"}
  notes: "Still asks 'Black race' (optional, No/Yes). Creatinine placeholder 'Norm: 62 - 115' => SSR default unit µmol/L; toggle via button in input[name=creatinine] + [data-input-end-adornment]. Page says it estimates a higher GFR for Black patients."

- id: mdcalc-cockcroft-gault

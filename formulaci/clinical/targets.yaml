  notes: "Creatinine inputs default to µmol/L in SSR (urine Cr Norm 1768-32708). The two clicks toggle the unit to mg/dL ONLY if the adornment currently reads µmol/L -- harness should check adornment text first. Since FENa is a ratio, entering both creatinines in the same unit is mathematically equivalent."


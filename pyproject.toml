[project]
name = "formulaci"
version = "0.1.0"
description = "A test suite for human knowledge: machine-verify the formulas people rely on (Wikipedia, clinical calculators)."
requires-python = ">=3.12"
dependencies = [
    "sympy>=1.13",
    "mpmath>=1.3",
    "lark>=1.1",
    "requests>=2.32",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "jinja2>=3.1",
    "mwparserfromhell>=0.6.6",
    "pyyaml>=6.0",
    "gmpy2>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-timeout>=2.3", "hypothesis>=6.100"]
web = ["playwright>=1.45"]
mcp = ["mcp>=1.2"]

[project.scripts]
formulaci = "formulaci.cli:app"
formulaci-mcp = "formulaci.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["formulaci"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
